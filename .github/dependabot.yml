version: 2
updates:
  # Keep npm build dependencies aligned with package.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    groups:
      frontend-build-dependencies:
        patterns:
          - "@fortawesome/*"
          - "esbuild"
          - "firebase"
          - "tailwindcss"
        update-types:
          - "minor"
          - "patch"

      # Major framework upgrades require a deliberate migration and must not
      # be proposed as routine dependency bumps.
      ignore:
        - dependency-name: "firebase"
          update-types: ["version-update:semver-major"]
        - dependency-name: "tailwindcss"
          update-types: ["version-update:semver-major"]

  # Keep GitHub Actions used by repository automation current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automation"
    groups:
      github-actions:
        patterns:
          - "*"
