name: Publish tagged release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install exact locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run complete repository validation
        run: npm test

  publish:
    name: Generate release notes and publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate notes and publish release
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
              throw new Error(`Tag "${tag}" does not follow vMAJOR.MINOR.PATCH format.`);
            }

            const { owner, repo } = context.repo;
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner, repo, tag
              });
              core.notice(`Release already exists for ${tag}: ${existing.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              owner, repo, tag_name: tag, target_commitish: "main"
            });
            const isPrerelease = tag.includes("-");
            const { data: release } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name: notes.name || `Medical Admission Pro ${tag}`,
              body: notes.body,
              draft: false,
              prerelease: isPrerelease,
              make_latest: isPrerelease ? "false" : "true"
            });
            core.notice(`Published release: ${release.html_url}`);
