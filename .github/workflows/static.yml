name: Build, validate and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Latest source commit must be able to replace a stuck/obsolete deployment.
concurrency:
  group: pages-release-final-20261111
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install project build dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build and validate
        run: npm test

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='_site/' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Smoke-test the live website
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke-test-live.mjs "$DEPLOYED_URL" --site-only

      - name: Write deployment summary
        if: success()
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## GitHub Pages deployment"
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: $DEPLOYED_URL"
            echo "- Validation: passed"
          } >> "$GITHUB_STEP_SUMMARY"
