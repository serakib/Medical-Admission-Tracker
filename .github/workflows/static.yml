name: Build, validate and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an active production deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      # package.json is the single source of truth for the exact direct build dependencies.
      - name: Install project build dependencies
        run: npm install --no-save --no-package-lock --prefer-offline --no-audit --no-fund

      # Runs the asset build plus syntax, SVG, asset-integrity and navigation checks.
      - name: Build and validate
        run: npm test

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='_site/' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Write deployment summary
        if: success()
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## GitHub Pages deployment"
            echo "- Commit: `$GITHUB_SHA`"
            echo "- URL: $DEPLOYED_URL"
            echo "- Validation: passed"
          } >> "$GITHUB_STEP_SUMMARY"
