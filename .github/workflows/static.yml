# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install pinned frontend build dependencies
        run: npm install --no-save --no-package-lock --prefer-offline --no-audit --no-fund --prefer-offline --no-audit --no-fund tailwindcss@3.4.17 firebase@10.14.1 esbuild@0.24.2 @fortawesome/free-solid-svg-icons@6.4.0 @fortawesome/free-regular-svg-icons@6.4.0 @fortawesome/free-brands-svg-icons@6.4.0
      - name: Build local frontend assets
        run: node scripts/build-local-assets.mjs
      - name: Generate local Avataaars browser definition
        run: node scripts/generate-avatar-browser-definition.mjs
      - name: Generate SVG asset manifest
        run: node scripts/generate-avatar-asset-manifest.mjs
      - name: Prepare static Pages artifact
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='_site/' ./ _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the site without build-only dependencies.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
