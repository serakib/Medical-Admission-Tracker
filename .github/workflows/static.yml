name: Build, validate and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Latest source commit must be able to replace a stuck/obsolete deployment.
concurrency:
  group: pages-recovery-20261111
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node22-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-npm-

      # Repair a stale lockfile before the production clean install.
      # The lockfile sync workflow commits the resulting lockfile back to main.
      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install project build dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # Runs the asset build plus syntax, SVG, asset-integrity and navigation checks.
      - name: Build and validate
        run: npm test

      # Install a real Chromium browser so startup is tested, not just HTTP asset availability.
      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='node_modules/' --exclude='_site/' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Verify the actual published site and every local HTML asset after deployment.
      - name: Smoke-test the live website
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke-test-live.mjs "$DEPLOYED_URL" --site-only

      # Load the real page in Chromium and assert that the app initializes and removes the splash.
      - name: Browser-test application startup
        continue-on-error: true
        timeout-minutes: 2
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke-test-browser.mjs "$DEPLOYED_URL"

      - name: Write deployment summary
        if: success()
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## GitHub Pages deployment"
            echo "- Commit: $GITHUB_SHA"
            echo "- URL: $DEPLOYED_URL"
            echo "- Validation: passed"
          } >> "$GITHUB_STEP_SUMMARY"
