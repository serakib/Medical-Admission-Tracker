name: Validate static app

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript syntax
        run: |
          node --input-type=module --check < script.js
          node --input-type=module --check < js/integrated-features.js
          node --input-type=module --check < js/student-ai.js
      - name: Check local assets referenced by index.html
        run: node scripts/check-integrity.mjs
