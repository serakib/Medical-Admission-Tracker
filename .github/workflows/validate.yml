name: Validate static app

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax of every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done < <(find . -type f \\( -name '*.js' -o -name '*.mjs' \\) -not -path './.git/*' -not -path './node_modules/*' -print0)
      - name: Check local assets referenced by index.html
        run: node scripts/check-integrity.mjs
