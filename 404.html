<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>404 | Medical Admission Tracker</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      font-family: sans-serif;
    }

    .page_404 {
      padding: 40px 16px;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .brand_404 {
      color: #222;
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 18px;
    }

    /* গুহার মানুষের লাফানোর GIF অ্যানিমেশন */
    .four_zero_four_bg {
      background-image: url('https://cdn.dribbble.com/users/285475/screenshots/2083086/dribbble_1.gif');
      height: 400px;
      max-width: 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
    }

    .four_zero_four_bg h1 {
      font-size: clamp(64px, 12vw, 80px);
      margin: 0;
    }

    .contant_box_404 {
      margin-top: -50px;
      padding: 0 12px;
    }

    .contant_box_404 h3 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .contant_box_404 p {
      color: #666;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      .four_zero_four_bg {
        height: 280px;
      }

      .contant_box_404 {
        margin-top: -25px;
      }

      .contant_box_404 h3 {
        font-size: 23px;
      }
    }
  </style>
</head>
<body>

  <section class="page_404">
    <div class="container">
      <p class="brand_404">Medical Admission Tracker</p>
      <div class="four_zero_four_bg">
        <h1 class="text-center">404</h1>
      </div>

      <div class="contant_box_404">
        <h3 class="h2">Look like you're lost</h3>
        <p>The page you are looking for is not available!</p>
      </div>
    </div>
  </section>

</body>
</html>
